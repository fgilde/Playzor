<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Playground panel</title>
    <base href="/" />
    <!--
        Host page for dockview popout groups. Intentionally almost empty: dockview clones the
        stylesheets of the opener into this document and moves the panel's dom node in here.
        Blazor is NOT started again — the node keeps belonging to the opener's renderer.
    -->
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            background-color: #1e1e1e;
        }

        body > .dv-popout-window {
            height: 100%;
        }
    </style>
    <script>
        // The preview iframe talks to the editor by posting to its parent. Moved in here that
        // parent is this window, and the editor listens in the opener — so pass it along.
        window.addEventListener('message', function (e) {
            if (!e.data || !e.data.__playzor || !window.opener || e.source === window.opener) return;
            try { window.opener.postMessage(e.data, location.origin); } catch (err) { /* opener gone */ }
        });
    </script>
</head>
<body></body>
</html>
